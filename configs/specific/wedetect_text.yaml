# WeDetect Base: Chinese class text, native model scores, no visual supports.
extends: [../common/diaowu_val300.yaml]
backend: wedetect
mode: train
max_reference_examples: 0
max_reference_crops: 0
max_reference_negatives: 0
wedetect:
  source_dir: ../../third_party/wedetect
  worker_python: ../../.venv-wedetect/Scripts/python.exe
  weights: ../../weights/wedetect/wedetect_base.pth
  language_model_dir: ../../weights/wedetect/xlm-roberta-base
  variant: base
  # Base WeDetect's official text interface uses Chinese class names.
  text_prompt: 吊物
  device: cpu
  confidence: 0.001
  nms_iou: 0.7
  max_detections: 100
  timeout_seconds: 600
  exclude_reference_overlap: true
evaluation:
  score_threshold: 0.5
  score_thresholds: [0.5, 0.7]
output_dir: ../../outputs/runs
