# YOLOE-11L: 5 fixed positive reference images, target crops + the latest English caption.
# P = normalize(0.75 * normalize(V) + 0.25 * normalize(T)).
extends: ../common/diaowu.yaml
backend: yoloe_fusion
task_id: diaowu
mode: train  # inference + evaluation; no training or weight updates
max_reference_examples: 0  # generic MLLM input counts; YOLOE shot count is below
max_reference_crops: 0
max_reference_negatives: 0
output_dir: ../../outputs/runs
reuse_predictions: true
yoloe_fusion:
  source_dir: ../../third_party/yoloe
  weights: ../../weights/yoloe/yoloe-11l-seg.pt
  text_encoder_weights: ../../weights/yoloe/mobileclip_blt.pt
  positive_count: 5
  selection_seed: 0
  aggregation: normalized_mean
  visual_weight: 0.75
  text_weight: 0.25
  text_prompt: >-
    a large hollow cylindrical load suspended from a yellow lifting hook by two taut
    slings spread to opposite sides, including the hook and slings.
  device: cpu
  torch_threads: 4
  imgsz: 640
  confidence: 0.001
  nms_iou: 0.7
  max_detections: 100
  exclude_reference_overlap: true
evaluation:
  iou_threshold: 0.5
  score_threshold: 0.5
  max_detections_per_image: 100
