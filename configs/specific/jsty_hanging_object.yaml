extends: ../common/diaowu.yaml
# JSTY hanging_object_det1_0_0_0_1：监督训练 YOLO，使用 FP32 ONNX。
# PT 含自定义 C2PSA_DA 层；ONNX Runtime 无需原训练工程即可推理。
backend: yolo_onnx
mode: train  # 推理并评估，不进行训练。
require_box_reason: false
reuse_predictions: true
cache_version: v1
max_reference_examples: 0
max_reference_crops: 0
max_reference_negatives: 0
yolo_onnx:
  weights: ../../weights/jsty_hanging_object/jsty_hanging_object_det1_0_0_0_1_fp32.onnx
  input_size: [960, 1280]  # [高, 宽]；RGB /255，等比例缩放后居中填充114。
  class_names: [hanging object]  # 实际模型仅1类；原部署PY写2，此处按模型实际通道设置。
  target_class_id: 0
  strides: [8, 16, 32]
  reg_max: 16
  confidence: 0.5  # 模型候选阈值，沿用原部署配置；做完整AP对比可另设0.001。
  nms_iou: 0.7
  max_detections: 300
  intra_op_threads: 4
  providers: [CPUExecutionProvider]
  exclude_reference_overlap: true  # 与现有99张固定测试集保持一致。
evaluation:
  iou_threshold: 0.5
  score_threshold: 0.5
  max_detections_per_image: 100  # COCO/VOC展示口径；模型候选上限为300。
# JSTY 监督训练吊物检测模型；不输入 few-shot 参考图。
output_dir: ../../outputs/runs
