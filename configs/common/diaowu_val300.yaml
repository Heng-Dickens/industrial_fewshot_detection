# Current v2: 300 images, 210 positive / 90 negative, 350 boxes, seed=42.
# Every positive includes a target with bbox area >= 2% of native image area.
# Original annotations and fixed reference pool are preserved.
# Reuse the existing labels and independent reference/support pool.
extends: [diaowu.yaml]
scene_name: diaowu_val300
dataset:
  image_dir: ../../data/raw/diaowu_val300/images
  ground_truth_dir: ../../data/raw/diaowu_val300/images
  recursive: false
  missing_ground_truth: error
  manifest_file: ../../data/raw/diaowu_val300/manifest.json
preparation:
  prepared_dir: ../../data/references/diaowu/preparation/val300
  splits_dir: ../../data/splits/diaowu_val300
  supports_dir: ../../data/references/diaowu
  split_seed: 42
  split_ratios: {train: 0, val: 1, test: 0}
