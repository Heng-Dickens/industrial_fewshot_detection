# Dataset-only settings; preserve the original archive's five class names/IDs.
scene_name: chache_val300
task_id: chache
labels:
  - {name: Chache1, description: 普通座驾叉车，驾驶位上方有护顶架，驾驶员坐着，前方有高门架和普通成对细长货叉；车身多为绿色或红色。}
  - {name: Chache2, description: 低位搬运车，车体小而低，驾驶员站着，前方伸出贴近地面的长双叉，无高起升门架和护顶架。}
  - {name: Chache3, description: 紧凑起重机车，车体较小，驾驶员站着，前方有明显竖直高门架及下部货叉，无驾驶位护顶架。}
  - {name: Chache4, description: 带大型专用属具的座驾叉车，驾驶员坐着，带护顶架和粗壮门架，前端装有醒目的黄色宽大搬运属具；车身通常为橙色。}
  - {name: Qianyinche, description: 单座位牵引车，车体低矮紧凑、外形圆润，带座椅和靠背，驾驶员坐着，无起升门架和成对货叉；车身通常为绿色。}
dataset:
  image_dir: ../../data/raw/chache_val300/images
  ground_truth_dir: ../../data/raw/chache_val300/images
  recursive: false
  missing_ground_truth: error
  manifest_file: ../../data/raw/chache_val300/manifest.json
evaluation:
  iou_threshold: 0.5
  score_threshold: 0.5
  score_thresholds: [0.5, 0.7]
  max_detections_per_image: 100
